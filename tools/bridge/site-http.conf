server {
    listen 80;
    server_name mpc.jqzhang.top;
    root /var/www/mpc-bridge;
    index index.html;
    charset utf-8;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ =404; }
}
