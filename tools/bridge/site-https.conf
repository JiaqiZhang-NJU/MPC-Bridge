server {
    listen 80;
    server_name mpc.jqzhang.top;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://mpc.jqzhang.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name mpc.jqzhang.top;
    ssl_certificate /etc/letsencrypt/live/mpc.jqzhang.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpc.jqzhang.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mpc_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/mpc-bridge;
    index index.html;
    charset utf-8;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    if ($host != mpc.jqzhang.top) { return 404; }
    location /downloads/ {
        try_files $uri =404;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
